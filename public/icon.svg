<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="signalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="4" />

  <!-- Radar Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="6 6" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="2" />
  <circle cx="256" cy="256" r="70" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Shield Shape / Emblem -->
  <path d="M 256 90 L 370 140 C 370 250, 320 345, 256 410 C 192 345, 142 250, 142 140 Z"
        fill="url(#shieldGrad)"
        stroke="#fca5a5"
        stroke-width="6"
        filter="url(#glow)" />

  <!-- Radio Mesh Wave Antennas -->
  <!-- Left Wave -->
  <path d="M 210 200 A 60 60 0 0 0 210 280" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  <path d="M 185 175 A 95 95 0 0 0 185 305" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.8" />
  <!-- Right Wave -->
  <path d="M 302 200 A 60 60 0 0 1 302 280" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  <path d="M 327 175 A 95 95 0 0 1 327 305" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.8" />

  <!-- Central Emergency Beacon Node -->
  <circle cx="256" cy="240" r="24" fill="#ffffff" filter="url(#glow)" />
  <circle cx="256" cy="240" r="14" fill="#ef4444" />
  
  <!-- Rescue Cross Emblem in Center -->
  <path d="M 250 226 H 262 V 254 H 250 Z M 242 234 H 270 V 246 H 242 Z" fill="#ffffff" />

  <!-- Bottom Accent Text / Node Connectivity Dots -->
  <circle cx="160" cy="445" r="8" fill="#38bdf8" />
  <line x1="168" y1="445" x2="248" y2="445" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4 4" />
  <circle cx="256" cy="445" r="10" fill="#22c55e" />
  <line x1="264" y1="445" x2="344" y2="445" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4 4" />
  <circle cx="352" cy="445" r="8" fill="#a855f7" />
</svg>
